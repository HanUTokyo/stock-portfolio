spring:
  datasource:
    url: jdbc:h2:mem:stock_portfolio_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  task:
    scheduling:
      enabled: false

app:
  fundamentals:
    backfill-missing-enabled: false
